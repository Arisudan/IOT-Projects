<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 600 22px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 18px Arial, sans-serif; fill: #334155; }
      .body { font: 400 17px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 15px Arial, sans-serif; fill: #475569; }
      .card { fill: url(#panel); stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .badge { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1.5; rx: 12; }
      .flowbox { fill: #ffffff; stroke: #60a5fa; stroke-width: 2; rx: 14; }
      .arrow { stroke: #0ea5e9; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0ea5e9" />
    </marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="60" y="62" class="title">Real-Time Machine Health Monitoring Platform</text>
  <rect x="60" y="92" width="250" height="34" class="badge"/>
  <text x="78" y="116" class="small">Generated showcase image</text>
  <rect x="60" y="150" width="520" height="500" class="card"/>
  <rect x="620" y="150" width="520" height="500" class="card"/>
  <text x="92" y="198" class="subtitle">Monitoring Flow Diagram</text>
  <rect x="95" y="230" width="450" height="300" rx="16" fill="#0f172a"/>
  <rect x="120" y="260" width="400" height="60" rx="12" fill="#1f2937"/>
  <text x="145" y="297" class="body" fill="#e2e8f0">Status Panel</text>
  <rect x="120" y="345" width="170" height="140" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
  <rect x="310" y="345" width="210" height="140" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
  <text x="145" y="380" class="small" fill="#f8fafc">Sensors -> Background Update</text>
  <text x="145" y="410" class="small" fill="#f8fafc">Update -> API Endpoint</text>
  <text x="145" y="440" class="small" fill="#f8fafc">API -> Browser Dashboard</text>
  <text x="660" y="198" class="subtitle">Monitoring Flow Diagram</text>
  <rect x="670" y="250" width="110" height="80" class="flowbox"/>
  <rect x="845" y="250" width="110" height="80" class="flowbox"/>
  <rect x="1020" y="250" width="110" height="80" class="flowbox"/>
  <text x="687" y="295" class="small">Input</text>
  <text x="860" y="295" class="small">Logic</text>
  <text x="1035" y="295" class="small">Output</text>
  <path d="M 780 290 L 845 290" class="arrow"/>
  <path d="M 955 290 L 1020 290" class="arrow"/>
  <rect x="670" y="390" width="460" height="190" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="700" y="430" class="label">Flow Summary</text>
  <text x="700" y="470" class="body">? Sensors -> Background Update</text>
  <text x="700" y="470" class="body">? Update -> API Endpoint</text>
  <text x="700" y="470" class="body">? API -> Browser Dashboard</text>

</svg>
