<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-label="AI-Based Energy Consumption Predictor roadmap and architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <linearGradient id="s4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <style>
      .title { font: 700 26px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .sub { font: 700 22px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .head { font: 700 40px Segoe UI, Arial, sans-serif; fill: #020617; }
      .txt { font: 600 22px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .body { font: 500 17px Segoe UI, Arial, sans-serif; fill: #1e293b; }
      .small { font: 500 14px Segoe UI, Arial, sans-serif; fill: #334155; }
      .card { fill: #f8fafc; stroke: #64748b; stroke-width: 3; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#94a3b8" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/>
    </marker>
  </defs>

  <rect width="1400" height="800" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" class="head">AI-BASED ENERGY CONSUMPTION PREDICTOR ROADMAP AND FLOW</text>

  <text x="700" y="130" text-anchor="middle" class="sub">Project Roadmap</text>

  <g filter="url(#shadow)">
    <rect x="58" y="168" width="292" height="68" rx="34" fill="url(#s1)"/>
    <rect x="388" y="168" width="292" height="68" rx="34" fill="url(#s2)"/>
    <rect x="718" y="168" width="292" height="68" rx="34" fill="url(#s3)"/>
    <rect x="1048" y="168" width="292" height="68" rx="34" fill="url(#s4)"/>
  </g>

  <text x="204" y="212" text-anchor="middle" class="txt">FOUNDATION</text>
  <text x="534" y="212" text-anchor="middle" class="txt">CORE AI MODEL</text>
  <text x="864" y="212" text-anchor="middle" class="txt">EXECUTION AND OUTPUT</text>
  <text x="1194" y="212" text-anchor="middle" class="txt">NEXT STEPS</text>

  <line x1="350" y1="202" x2="388" y2="202" stroke="#1e3a8a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="680" y1="202" x2="718" y2="202" stroke="#1e3a8a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1010" y1="202" x2="1048" y2="202" stroke="#1e3a8a" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="88" y="280" class="title">PROJECT SETUP</text>
  <text x="88" y="308" class="body">- Python installed</text>
  <text x="88" y="334" class="body">- Folder prepared</text>
  <text x="88" y="378" class="title">DATA PREPARATION</text>
  <text x="88" y="406" class="body">- Historical energy CSV</text>
  <text x="88" y="432" class="body">- Clean numeric readings</text>

  <text x="418" y="280" class="title">MODEL DEVELOPMENT</text>
  <text x="418" y="308" class="body">- Trend and baseline analysis</text>
  <text x="418" y="334" class="body">- Forecast window logic</text>
  <text x="418" y="378" class="title">PREDICTION ENGINE</text>
  <text x="418" y="406" class="body">- Next-day estimation</text>
  <text x="418" y="432" class="body">- Confidence-style summary</text>

  <text x="748" y="280" class="title">RUN SCRIPT</text>
  <text x="748" y="308" class="body">- python main.py</text>
  <text x="748" y="334" class="body">- Custom CLI args supported</text>
  <text x="748" y="378" class="title">TERMINAL REPORT</text>
  <text x="748" y="406" class="body">- Predicted values</text>
  <text x="748" y="432" class="body">- Usage trend suggestion</text>

  <text x="1078" y="280" class="title">DASHBOARD</text>
  <text x="1078" y="308" class="body">- Charts and visualization</text>
  <text x="1078" y="352" class="title">APPLIANCE VIEW</text>
  <text x="1078" y="380" class="body">- Granular energy insights</text>
  <text x="1078" y="424" class="title">CLOUD ALERTS</text>
  <text x="1078" y="452" class="body">- Storage and smart notifications</text>

  <text x="700" y="535" text-anchor="middle" class="sub">Block Diagram (System Architecture)</text>

  <rect x="116" y="602" width="250" height="120" rx="16" class="card"/>
  <rect x="448" y="584" width="510" height="156" rx="16" class="card"/>
  <rect x="1038" y="602" width="250" height="120" rx="16" class="card"/>

  <text x="241" y="656" text-anchor="middle" class="title">HISTORICAL DATA</text>
  <text x="241" y="684" text-anchor="middle" class="small">CSV / sample readings</text>

  <text x="703" y="630" text-anchor="middle" class="title">AI-BASED ENERGY CONSUMPTION PREDICTOR</text>
  <rect x="484" y="652" width="205" height="70" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="716" y="652" width="205" height="70" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="586" y="684" text-anchor="middle" class="txt">MODEL ANALYSIS</text>
  <text x="818" y="684" text-anchor="middle" class="txt">FORECAST LOGIC</text>

  <text x="1163" y="656" text-anchor="middle" class="title">OUTPUT</text>
  <text x="1163" y="684" text-anchor="middle" class="small">Predicted values and trend</text>

  <line x1="366" y1="662" x2="448" y2="662" stroke="#1e3a8a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="958" y1="662" x2="1038" y2="662" stroke="#1e3a8a" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
