<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <style>
      .title { font: 700 36px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 18px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 15px Arial, sans-serif; fill: #334155; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .step { fill: #be123c; opacity: 0.95; rx: 16; }
      .stepText { font: 700 18px Arial, sans-serif; fill: white; }
      .road { stroke: #be123c; stroke-width: 6; fill: none; stroke-linecap: round; stroke-dasharray: 12 10; }
      .dot { fill: #be123c; }
      .mini { fill: #f8fafc; stroke: #be123c; stroke-width: 2; rx: 14; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="60" y="64" class="title">Smart Home Digital Twin</text>
  <text x="60" y="98" class="small">Roadmap and block diagram snapshot</text>

  <rect x="60" y="140" width="1080" height="240" class="card"/>
  <text x="90" y="182" class="subtitle">Roadmap</text>
  <path d="M 110 300 C 240 230, 330 360, 460 290 S 700 230, 820 290 S 1010 360, 1080 260" class="road"/>
  <circle cx="160" cy="286" r="14" class="dot"/>
  <circle cx="330" cy="315" r="14" class="dot"/>
  <circle cx="520" cy="286" r="14" class="dot"/>
  <circle cx="710" cy="255" r="14" class="dot"/>
  <circle cx="900" cy="296" r="14" class="dot"/>
  <rect x="100" y="220" width="220" height="64" class="step"/>
  <rect x="410" y="250" width="220" height="64" class="step"/>
  <rect x="710" y="220" width="220" height="64" class="step"/>
  <text x="125" y="250" class="stepText">Light ON</text>
  <text x="435" y="280" class="stepText">Fan OFF</text>
  <text x="735" y="250" class="stepText">Door CLOSED</text>

  <rect x="60" y="410" width="1080" height="250" class="card"/>
  <text x="90" y="452" class="subtitle">Block Diagram</text>
  <rect x="90" y="500" width="220" height="110" class="mini"/>
  <rect x="360" y="500" width="220" height="110" class="mini"/>
  <rect x="630" y="500" width="220" height="110" class="mini"/>
  <rect x="900" y="500" width="180" height="110" class="mini"/>
  <text x="124" y="545" class="body">Devices</text>
  <text x="394" y="545" class="body">MQTT</text>
  <text x="664" y="545" class="body">Twin</text>
  <text x="934" y="545" class="body">Output</text>
  <path d="M 310 555 L 360 555" class="road"/>
  <path d="M 580 555 L 630 555" class="road"/>
  <path d="M 850 555 L 900 555" class="road"/>
</svg>
